name: Publish Docker image

# Builds the production image into a private, repo-scoped ECR intake. amd64 and
# arm64 are built on native runners and scanned before the manifest advances.
# Clarity's single-writer Copa workflow then narrows, patches, signs, verifies,
# and promotes the runtime image; this workflow waits for that gate to finish.

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  schedule:
    - cron: '47 9 * * *'
  workflow_dispatch:

concurrency:
  group: clarity-production-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::330368327370:role/clarity-trypost-image-publisher
  ECR_REGISTRY: 330368327370.dkr.ecr.us-east-1.amazonaws.com
  INTAKE_IMAGE: 330368327370.dkr.ecr.us-east-1.amazonaws.com/clarity-intake-trypost
  RUNTIME_REPOSITORY: clarity-3p-trypost
  TRIVY_VERSION: 0.72.0

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            trivy-arch: 64bit
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            trivy-arch: ARM64
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Prepare platform slug
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure private AWS image intake
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: trypost-build-${{ github.run_id }}
          allowed-account-ids: "330368327370"

      - name: Log in to private ECR
        run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build and push isolated platform subject
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          target: production
          platforms: ${{ matrix.platform }}
          tags: ${{ env.INTAKE_IMAGE }}:build-${{ github.sha }}-${{ env.PLATFORM_PAIR }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VITE_REVERB_APP_KEY=trypost-reverb-key
            VITE_REVERB_HOST=trypost.theclarity.us
            VITE_REVERB_PORT=443
            VITE_REVERB_SCHEME=https
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
          provenance: false
          sbom: false
          push: true

      - name: Install verified Trivy binary
        run: |
          archive="trivy_${TRIVY_VERSION}_Linux-${{ matrix.trivy-arch }}.tar.gz"
          curl -fsSLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}"
          curl -fsSLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " ${archive}$" "trivy_${TRIVY_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${archive}" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy

      - name: Reject fixable critical vulnerabilities
        run: trivy image --platform "${{ matrix.platform }}" --exit-code 1 --severity CRITICAL --ignore-unfixed "${INTAKE_IMAGE}@${{ steps.build.outputs.digest }}"

  merge:
    name: Publish and verify private runtime candidate
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 55
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure private AWS image intake
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: trypost-publish-${{ github.run_id }}
          role-duration-seconds: 3600
          allowed-account-ids: "330368327370"

      - name: Log in to private ECR
        run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Publish verified private intake manifest
        run: |
          docker buildx imagetools create \
            -t "${INTAKE_IMAGE}:sha-${GITHUB_SHA}" \
            -t "${INTAKE_IMAGE}:latest" \
            "${INTAKE_IMAGE}:build-${GITHUB_SHA}-linux-amd64" \
            "${INTAKE_IMAGE}:build-${GITHUB_SHA}-linux-arm64"
          docker buildx imagetools inspect "${INTAKE_IMAGE}:sha-${GITHUB_SHA}"

      - name: Patch, sign, and verify the runtime image
        run: |
          payload="$(jq -cn \
            --arg trigger "${GITHUB_REPOSITORY}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:${GITHUB_SHA}" \
            --arg repo "$RUNTIME_REPOSITORY" \
            '{triggerId:$trigger,overrides:{MIRROR_REFRESH:"true",MIRROR_REPOS_OVERRIDE:$repo,COPA_REPOS_OVERRIDE:$repo}}')"
          function_error="$(aws lambda invoke \
            --function-name clarity-copa-build-debounce \
            --cli-binary-format raw-in-base64-out \
            --payload "$payload" \
            --query FunctionError \
            --output text \
            /tmp/copa-response.json)"
          test "$function_error" = "None"
          execution_arn="$(jq -er '.executionArn' /tmp/copa-response.json)"
          status="$(jq -er '.status' /tmp/copa-response.json)"
          while test "$status" = "RUNNING"; do
            sleep 30
            status="$(aws stepfunctions describe-execution \
              --execution-arn "$execution_arn" \
              --query status \
              --output text)"
          done
          test "$status" = "SUCCEEDED"
